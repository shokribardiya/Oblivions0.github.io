/* ==========================================================================

:root{

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.55;

}
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }

.vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
::-webkit-scrollbar{ width:10px; height:10px; }

/* ---------- app shell ---------- */
#app-shell{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--bg-raised); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:40;
  transform:translateX(0); transition:transform .18s ease;
}
.sidebar-brand{
  display:flex; align-items:center; gap:10px; padding:16px 18px;
  border-bottom:1px solid var(--border); flex:0 0 auto;
}
.brand-mark{ width:20px; height:20px; flex:0 0 auto; }
.brand-mark svg{ display:block; width:100%; height:100%; }
.brand-name{ font-weight:600; letter-spacing:0.06em; font-size:13px; }
.brand-tag{ display:block; font-size:10px; color:var(--text-faint); letter-spacing:0.04em; margin-top:1px; }

.sidebar-nav{ flex:1 1 auto; overflow-y:auto; padding:10px 0; }
.nav-group{ padding:0 10px; margin-bottom:2px; }
.nav-label{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border-radius:var(--radius); color:var(--text-dim);
  font-size:12px; letter-spacing:0.05em; font-weight:600; text-transform:uppercase;
  cursor:pointer; border-left:2px solid transparent;
}
.nav-label:hover{ background:var(--surface); color:var(--text); }
.nav-label.active{ background:var(--accent-soft); color:var(--accent-text); border-left:2px solid var(--accent); }
.nav-ic{ width:14px; height:14px; flex:0 0 auto; opacity:.9; }
.nav-ic svg{ width:100%; height:100%; display:block; }

.sidebar-foot{ flex:0 0 auto; border-top:1px solid var(--border); padding:12px 16px; }
.status-row{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--text-dim); }
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft); }
.ver-row{ font-size:11px; color:var(--text-faint); margin-top:6px; font-family:var(--mono); }

.sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:39; }

/* ---------- main column ---------- */
.main-col{ flex:1 1 auto; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column; }

.topbar{
  height:var(--topbar-h); flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:0 16px; border-bottom:1px solid var(--border); background:var(--bg);
  position:sticky; top:0; z-index:30;
}
.menu-btn{ display:none; background:none; border:1px solid var(--border); color:var(--text-dim); width:32px; height:32px; border-radius:var(--radius); align-items:center; justify-content:center; cursor:pointer; }
.menu-btn svg{ width:16px; height:16px; }
.crumbs{ font-size:12px; color:var(--text-faint); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crumbs b{ color:var(--text-dim); font-weight:500; }
.topbar-spacer{ flex:1 1 auto; }
.search-trigger{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  color:var(--text-faint); padding:6px 10px; border-radius:var(--radius); cursor:pointer; font-size:12.5px; min-width:220px;
}
.search-trigger:hover{ border-color:var(--border-strong); color:var(--text-dim); }
.search-trigger svg{ width:14px; height:14px; flex:0 0 auto; }
.kbd{ margin-left:auto; font-family:var(--mono); font-size:10.5px; border:1px solid var(--border-strong); background:var(--surface-2); padding:1px 5px; border-radius:3px; color:var(--text-faint); }
.icon-btn{ background:none; border:1px solid transparent; color:var(--text-dim); width:32px; height:32px; border-radius:var(--radius); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; position:relative; }
.icon-btn:hover{ background:var(--surface); border-color:var(--border); color:var(--text); }
.icon-btn svg{ width:16px; height:16px; }
.dot-badge{ position:absolute; top:5px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.admin-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); padding:5px 10px; border-radius:var(--radius); font-size:12px; color:var(--text-dim); cursor:pointer; }
.admin-pill:hover{ border-color:var(--border-strong); color:var(--text); }

main#view{ flex:1 1 auto; }
.container{ max-width:1180px; margin:0 auto; padding:32px 28px 64px; }
.container-wide{ max-width:1400px; margin:0 auto; padding:24px 28px 64px; }

/* ---------- typography ---------- */
h1,h2,h3,h4{ margin:0; font-family:var(--sans); font-weight:600; letter-spacing:-0.01em; color:var(--text); }
.eyebrow{ font-family:var(--mono); font-size:11px; color:var(--accent-text); letter-spacing:0.08em; }
.page-h1{ font-size:26px; margin-top:6px; }
.page-lede{ color:var(--text-dim); font-size:14.5px; max-width:640px; margin-top:10px; }
.section-h{ font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin:0 0 14px; display:flex; align-items:center; gap:10px; }
.section-h::after{ content:""; flex:1 1 auto; height:1px; background:var(--border); }
p{ color:var(--text-dim); }

/* ---------- badges / chips ---------- */
.badge{ display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:0.03em; padding:2px 7px; border-radius:2px; border:1px solid var(--border-strong); text-transform:uppercase; }
.badge.b-good{ color:var(--good); background:var(--good-soft); border-color:transparent; }
.badge.b-warn{ color:var(--warn); background:var(--warn-soft); border-color:transparent; }
.badge.b-info{ color:var(--info); background:var(--info-soft); border-color:transparent; }
.badge.b-neutral{ color:var(--text-dim); background:var(--surface-2); border-color:var(--border); }
.badge.b-danger{ color:var(--danger); background:var(--danger-soft); border-color:transparent; }
.tag{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border); padding:2px 6px; border-radius:2px; }

/* ---------- cards / grids ---------- */
.grid{ display:grid; gap:12px; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:980px){ .grid-3,.grid-4{ grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr;} }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; }
.card-obj{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:10px; transition:border-color .12s ease; }
.card-obj:hover{ border-color:var(--border-strong); }
.card-obj-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.card-obj-name{ font-size:14.5px; font-weight:600; }
.card-obj-cat{ font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-top:2px; }
.card-obj-desc{ font-size:12.8px; color:var(--text-dim); flex:1 1 auto; }
.card-obj-tags{ display:flex; flex-wrap:wrap; gap:5px; }
.card-obj-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; font-size:11px; color:var(--text-faint); }

.metadata-row{ display:flex; gap:22px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--border); }
.metadata-item .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-family:var(--mono); margin-bottom:4px; }
.metadata-item .v{ font-size:13.5px; color:var(--text); }

.panel{ border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); }
.panel-head{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; color:var(--text-dim); font-weight:600; letter-spacing:0.02em; display:flex; align-items:center; justify-content:space-between; }
.panel-body{ padding:14px; }

.table{ width:100%; border-collapse:collapse; font-size:13px; }
.table th{ text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; color:var(--text-faint); letter-spacing:0.05em; padding:8px 10px; border-bottom:1px solid var(--border-strong); }
.table td{ padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
.table tr:hover td{ background:var(--surface-2); }
.row-link{ cursor:pointer; }

.timeline{ position:relative; padding-left:18px; }
.timeline::before{ content:""; position:absolute; left:4px; top:4px; bottom:4px; width:1px; background:var(--border-strong); }
.tl-item{ position:relative; padding-bottom:16px; }
.tl-item::before{ content:""; position:absolute; left:-18px; top:4px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.tl-item .t{ font-family:var(--mono); font-size:11px; color:var(--text-faint); }
.tl-item .d{ font-size:13px; color:var(--text); margin-top:2px; }

.empty-state{ border:1px dashed var(--border-strong); border-radius:var(--radius-lg); padding:34px 20px; text-align:center; color:var(--text-faint); font-size:13px; }
.empty-state .t{ color:var(--text-dim); font-size:14px; margin-bottom:4px; }

.btn{ display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); font-size:12.5px; padding:7px 13px; border-radius:var(--radius); cursor:pointer; }
.btn:hover{ border-color:var(--text-faint); }
.btn-accent{ background:var(--accent-soft); border-color:var(--accent-dim); color:var(--accent-text); }
.btn-accent:hover{ border-color:var(--accent); }
.btn-danger{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
.btn-ghost{ background:none; border-color:var(--border); color:var(--text-dim); }
.btn-sm{ padding:4px 9px; font-size:11.5px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }

.hr{ height:1px; background:var(--border); border:0; margin:22px 0; }

/* ---------- hero ---------- */
.hero{ padding:44px 0 30px; border-bottom:1px solid var(--border); }
.hero-title{ font-size:34px; line-height:1.1; margin-top:10px; max-width:680px; }
.hero-sub{ margin-top:12px; color:var(--text-dim); max-width:560px; font-size:14.5px; }
.hero-readout{ display:flex; gap:26px; margin-top:26px; flex-wrap:wrap; }
.readout-item .num{ font-family:var(--mono); font-size:22px; color:var(--text); }
.readout-item .lbl{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.hero-actions{ display:flex; gap:10px; margin-top:26px; }

/* ---------- forms ---------- */
label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
input[type=text],input[type=email],input[type=password],input[type=search],textarea,select{
  width:100%; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
  padding:8px 10px; border-radius:var(--radius); font-size:13px; font-family:inherit;
}
textarea{ resize:vertical; min-height:110px; font-family:var(--mono); font-size:12.5px; }
.field{ margin-bottom:14px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ .field-row{ grid-template-columns:1fr; } }

/* ---------- graph ---------- */
.graph-wrap{ border:1px solid var(--border); border-radius:var(--radius-lg); background:radial-gradient(ellipse at center, var(--surface) 0%, var(--bg-raised) 100%); overflow:hidden; }
.graph-svg{ width:100%; height:auto; display:block; }
.g-node circle{ fill:var(--surface-2); stroke:var(--border-strong); stroke-width:1.4; transition:stroke .12s,fill .12s; cursor:pointer; }
.g-node text{ fill:var(--text-dim); font-family:var(--mono); font-size:10px; pointer-events:none; }
.g-node.core circle{ fill:var(--accent-soft); stroke:var(--accent-dim); }
.g-node.dim circle{ opacity:.28; } .g-node.dim text{ opacity:.28; }
.g-node.hi circle{ stroke:var(--accent); fill:var(--accent-soft); }
.g-edge{ stroke:var(--border-strong); stroke-width:1; fill:none; }
.g-edge.hi{ stroke:var(--accent); stroke-width:1.4; }
.g-edge.dim{ opacity:.15; }
.g-legend{ display:flex; gap:16px; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint); }
.g-legend span{ display:inline-flex; align-items:center; gap:6px; }
.g-legend i{ width:16px; height:1px; background:var(--border-strong); display:inline-block; }

/* ---------- command palette / search modal ---------- */
.modal-scrim{ position:fixed; inset:0; background:rgba(6,7,9,0.6); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
.cmdk{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); overflow:hidden; }
.cmdk-input-row{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); }
.cmdk-input-row svg{ width:16px; height:16px; color:var(--text-faint); flex:0 0 auto; }
.cmdk-input-row input{ border:none; background:none; padding:0; font-size:15px; }
.cmdk-input-row input:focus{ outline:none; }
.cmdk-list{ max-height:360px; overflow-y:auto; padding:6px; }
.cmdk-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius); cursor:pointer; font-size:13px; }
.cmdk-item:hover,.cmdk-item.sel{ background:var(--surface-2); }
.cmdk-item .type{ font-family:var(--mono); font-size:10px; color:var(--text-faint); border:1px solid var(--border-strong); padding:1px 5px; border-radius:2px; text-transform:uppercase; }
.cmdk-item .nm{ flex:1 1 auto; }
.cmdk-empty{ padding:24px; text-align:center; color:var(--text-faint); font-size:12.5px; }
.cmdk-foot{ display:flex; gap:14px; padding:8px 14px; border-top:1px solid var(--border); font-size:10.5px; color:var(--text-faint); }

/* ---------- toast ---------- */
#toast-host{ position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--surface-2); border:1px solid var(--border-strong); border-left:3px solid var(--accent); padding:10px 14px; border-radius:var(--radius); font-size:12.5px; box-shadow:var(--shadow-1); min-width:220px; }
.toast.danger{ border-left-color:var(--danger); }

/* ---------- admin ---------- */
.admin-shell{ display:flex; min-height:calc(100vh - var(--topbar-h)); }
.admin-side{ width:200px; flex:0 0 200px; border-right:1px solid var(--border); padding:16px 8px; }
.admin-side a{ display:block; padding:8px 10px; font-size:12.5px; color:var(--text-dim); border-radius:var(--radius); }
.admin-side a:hover{ background:var(--surface); color:var(--text); }
.admin-side a.active{ background:var(--accent-soft); color:var(--accent-text); }
.admin-main{ flex:1 1 auto; padding:22px 26px; min-width:0; }
.admin-banner{ background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn); font-size:12px; padding:9px 13px; border-radius:var(--radius); margin-bottom:18px; font-family:var(--mono); }
.login-wrap{ max-width:380px; margin:60px auto; }
.login-step{ font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-bottom:10px; }
.stat-strip{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.stat-box{ flex:1 1 140px; border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 14px; background:var(--surface); }
.stat-box .n{ font-family:var(--mono); font-size:20px; }
.stat-box .l{ font-size:11px; color:var(--text-faint); margin-top:2px; }

/* markdown preview */
.md-preview h1,.md-preview h2,.md-preview h3{ margin:16px 0 8px; }
.md-preview p{ margin:0 0 10px; }
.md-preview blockquote{ margin:0 0 10px; padding-left:12px; border-left:2px solid var(--border-strong); color:var(--text-faint); }
.md-preview code{ background:var(--surface-2); padding:1px 5px; border-radius:2px; font-family:var(--mono); font-size:12px; }
.md-preview ul{ margin:0 0 10px; padding-left:20px; }
.md-preview a{ color:var(--accent-text); text-decoration:underline; }

/* ---------- responsive shell ---------- */
@media (max-width: 900px){
  .sidebar{ transform:translateX(-100%); }
  .sidebar.open{ transform:translateX(0); box-shadow:var(--shadow-1); }
  .sidebar.open ~ .sidebar-scrim{ display:block; }
  .main-col{ margin-left:0; }
  .menu-btn{ display:inline-flex; }
  .search-trigger{ min-width:0; flex:1 1 auto; }
  .admin-shell{ flex-direction:column; }
  .admin-side{ width:100%; flex:none; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); }
}
.skip-link{ position:absolute; left:-999px; top:0; background:var(--accent); color:#111; padding:8px 12px; z-index:300; }
.skip-link:focus{ left:8px; top:8px; }

function escapeHTML(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function safeHref(url){
  if(!url) return "#";
  const u = String(url).trim();
  if(/^javascript:/i.test(u) || /^data:/i.test(u) || /^vbscript:/i.test(u)) return "#";
  return escapeHTML(u);
}
function fmtDate(iso){
  if(!iso) return "—";
  try{
    const d = new Date(iso+"T00:00:00");
    if(isNaN(d)) return escapeHTML(iso);
    return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"2-digit"});
  }catch(e){ return escapeHTML(iso); }
}
function uid(prefix){ return (prefix||"id")+"-"+Math.random().toString(36).slice(2,9); }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

/* Minimal, safe markdown-like renderer (no external libs). Escapes first, then
   applies a small whitelist of patterns, then sanitizes resulting links. */
function renderMarkdownSafe(src){
  let s = escapeHTML(src||"");
  // headings
  s = s.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  s = s.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  s = s.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  // blockquote
  s = s.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  // bold / italic / code
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/`(.+?)`/g, "<code>$1</code>");
  // links [text](url) — url already escaped by escapeHTML above; re-validate protocol
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_,t,u){
    const url = /^(javascript|data|vbscript):/i.test(u) ? "#" : u;
    return '<a href="'+url+'" rel="noopener noreferrer" target="_blank">'+t+"</a>";
  });
  // unordered lists
  s = s.replace(/(^|\n)-\s(.*)(?=\n|$)/g, "$1<li>$2</li>");
  s = s.replace(/(<li>.*<\/li>)/gs, function(m){ return m.indexOf("<ul>")===-1 ? "<ul>"+m+"</ul>" : m; });
  // paragraphs: wrap remaining bare lines
  s = s.split(/\n{2,}/).map(block=>{
    if(/^\s*<(h1|h2|h3|ul|blockquote)/.test(block)) return block;
    if(!block.trim()) return "";
    return "<p>"+block.replace(/\n/g,"<br>")+"</p>";
  }).join("\n");
  return s;
}

/* ==========================================================================
   STATE MANAGEMENT / SERVICES
   ("ContentStore", "AuthService", "MediaStore", "SearchService" — local
   implementations for this static single-file build. See #/admin/settings
   for the documented backend contract these would be swapped for.)
   ========================================================================== */
const ContentStore = (function(){
  const KEY = "oblivion_demo_store_v1";
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return blank();
      const parsed = JSON.parse(raw);
      return Object.assign(blank(), parsed);
    }catch(e){ return blank(); }
  }
  function blank(){
    return { research:[], engineering:[], releases:[], media:[], audit:[] };
  }
  let state = load();
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast("Local storage unavailable — changes will not persist.", "danger"); }
  }
  function log(action, objectType, objectName){
    state.audit.unshift({ ts:new Date().toISOString(), action, objectType, objectName, admin:"local-admin" });
    if(state.audit.length>200) state.audit.length = 200;
  }
  return {
    all(){ return state; },
    reset(){ state = blank(); persist(); },
    list(kind){ return state[kind] || []; },
    get(kind, slugOrId){
      return (state[kind]||[]).find(x=>x.id===slugOrId || x.slug===slugOrId);
    },
    upsert(kind, item){
      const arr = state[kind] || (state[kind]=[]);
      const idx = arr.findIndex(x=>x.id===item.id);
      const isNew = idx===-1;
      if(isNew){ arr.unshift(item); } else { arr[idx]=item; }
      log(isNew?"CREATED":"UPDATED", kind, item.name || item.title || item.id);
      persist();
    },
    setStatus(kind, id, status){
      const item = (state[kind]||[]).find(x=>x.id===id);
      if(!item) return;
      item.status = status;
      log(status.toUpperCase(), kind, item.name || item.title || item.id);
      persist();
    },
    remove(kind, id){
      const arr = state[kind] || [];
      const item = arr.find(x=>x.id===id);
      state[kind] = arr.filter(x=>x.id!==id);
      if(item) log("DELETED", kind, item.name || item.title || item.id);
      persist();
    },
    addMedia(item){ state.media.unshift(item); log("UPLOADED","media",item.name); persist(); },
    removeMedia(id){ state.media = state.media.filter(m=>m.id!==id); persist(); },
    audit(){ return state.audit; }
  };
})();

const Router = { current:{path:"home", parts:[]} };
function parseHash(){
  let h = location.hash.replace(/^#\/?/, "");

  const parts = h.split("/").filter(Boolean);
  return { path:h, parts };
}
function navigate(hash){ location.hash = "#/"+hash; }
window.addEventListener("hashchange", renderRoute);

function renderRoute(){
  const r = parseHash();
  Router.current = r;
  const view = qs("#view");
  const p = r.parts;
  try{
    if(p[0]==="admin"){ renderAdminRoute(p.slice(1), view); }
    else if(p.length===0 || p[0]==="home"){ renderHome(view); }
    else if(p[0]==="products" && p[1]){ renderProductDetail(view, p[1]); }
    else if(p[0]==="products"){ renderProducts(view); }
    else if(p[0]==="systems"){ renderSystems(view); }
    else if(p[0]==="research" && p[1]){ renderResearchDetail(view, p[1]); }
    else if(p[0]==="research"){ renderResearchList(view); }
    else if(p[0]==="engineering" && p[1]){ renderEngineeringDetail(view, p[1]); }
    else if(p[0]==="engineering"){ renderEngineeringList(view); }
    else if(p[0]==="releases"){ renderReleases(view); }
    else if(p[0]==="developers"){ renderDevelopers(view); }
    else if(p[0]==="about"){ renderAbout(view); }
    else if(p[0]==="security"){ renderSecurity(view); }
    else if(p[0]==="search"){ renderSearchPage(view); }
    else { renderNotFound(view); }
  }catch(e){
    console.error(e);
    renderErrorState(view, e);
  }
  updateActiveNav();
  updateCrumbs();
  view.focus();
  window.scrollTo(0,0);
  closeSidebarOnMobile();
}

function renderErrorState(view, e){
  view.innerHTML = `<div class="container"><div class="empty-state">
    <div class="t">Something went wrong rendering this view.</div>
    <div class="mono" style="margin-top:8px;font-size:11px;color:var(--text-faint)">${escapeHTML(e && e.message || "")}</div>
    <div style="margin-top:16px"><a class="btn btn-accent" href="#/home">Return to Command Center</a></div>
  </div></div>`;
}
function renderNotFound(view){
  view.innerHTML = `<div class="container"><div class="empty-state">
    <div class="t">Object not found</div>
    <p style="margin:0">The route or object you requested does not exist.</p>
    <div style="margin-top:16px"><a class="btn btn-accent" href="#/home">Return to Command Center</a></div>

/* ==========================================================================
   SYSTEM GRAPH ENGINE — native SVG, no libraries
   ========================================================================== */
function buildGraphData(){
  const nodes = [{id:"oblivion", label:"OBLIVION", kind:"core"}];
  PRODUCTS.forEach(p=>nodes.push({id:p.id, label:p.name, kind:"product"}));
  nodes.push({id:"research", label:"RESEARCH", kind:"cat"});
  nodes.push({id:"developers", label:"DEVELOPERS", kind:"cat"});
  nodes.push({id:"bardia-shokri", label:"BARDIA SHOKRI", kind:"person"});

  const edges = [];
  PRODUCTS.forEach(p=>{
    edges.push({from:"oblivion", to:p.id, rel:"CONTAINS"});
    edges.push({from:p.id, to:"research", rel:"RESEARCHED_BY"});
  });
  edges.push({from:"bardia-shokri", to:"oblivion", rel:"BUILT_BY"});
  edges.push({from:"oblivion", to:"developers", rel:"RELATED_TO"});
  PRODUCTS.forEach(p=>{
    (p.related||[]).forEach(rid=>{
      if(nodes.find(n=>n.id===rid)) edges.push({from:p.id, to:rid, rel:"RELATED_TO"});
    });
  });
  return {nodes, edges};
}
function layoutRadial(nodes){
  const cx=460, cy=280;
  const core = nodes.find(n=>n.kind==="core");
  core.x=cx; core.y=cy;
  const ring1 = nodes.filter(n=>n.kind==="product");
  const ring2 = nodes.filter(n=>n.kind==="cat"||n.kind==="person");
  ring1.forEach((n,i)=>{
    const a = (i/ring1.length)*Math.PI*2 - Math.PI/2;
    n.x = cx + Math.cos(a)*170; n.y = cy + Math.sin(a)*150;
  });
  ring2.forEach((n,i)=>{
    const a = (i/ring2.length)*Math.PI*2 - Math.PI/2 + 0.6;
    n.x = cx + Math.cos(a)*300; n.y = cy + Math.sin(a)*230;
  });
  return nodes;
}
function renderSystems(view){
  const {nodes, edges} = buildGraphData();
  layoutRadial(nodes);
  const nodeMap = {}; nodes.forEach(n=>nodeMap[n.id]=n);

  const edgeSvg = edges.map((e,i)=>{
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if(!a||!b) return "";
    return `<path class="g-edge" data-i="${i}" data-from="${e.from}" data-to="${e.to}" d="M${a.x} ${a.y} L${b.x} ${b.y}"></path>`;
  }).join("");

  const nodeSvg = nodes.map(n=>{
    const r = n.kind==="core" ? 30 : n.kind==="product" ? 22 : 16;
    return `<g class="g-node ${n.kind==="core"?"core":""}" data-id="${n.id}" transform="translate(${n.x},${n.y})" tabindex="0" role="button" aria-label="${escapeHTML(n.label)}">
      <circle r="${r}"></circle>
      <text text-anchor="middle" y="${r+14}">${escapeHTML(n.label)}</text>
    </g>`;
  }).join("");

  view.innerHTML = `<div class="container-wide">
    <div class="eyebrow">SYSTEM GRAPH</div>
    <h1 class="page-h1">Systems</h1>
    <p class="page-lede">A relationship map of OBLIVION's core entity, its products, research, and people. Hover or select a node to trace its connections.</p>
    <div class="graph-wrap" style="margin-top:20px">
      <svg class="graph-svg" viewBox="0 0 920 520" id="graph-svg" role="img" aria-label="OBLIVION system relationship graph">
        <g id="edge-layer">${edgeSvg}</g>
        <g id="node-layer">${nodeSvg}</g>
      </svg>
      <div class="g-legend">
        <span><i></i> RELATED_TO / CONTAINS</span>
        <span>Click a node to focus its object page</span>
      </div>
    </div>
    <div id="graph-detail" style="margin-top:18px"></div>
  </div>`;

  const svg = qs("#graph-svg");
  function neighborsOf(id){
    const set = new Set([id]);
    edges.forEach(e=>{ if(e.from===id) set.add(e.to); if(e.to===id) set.add(e.from); });
    return set;
  }
  function focusNode(id){
    const nb = neighborsOf(id);
    qsa(".g-node", svg).forEach(el=>{
      const nid = el.getAttribute("data-id");
      el.classList.toggle("dim", !nb.has(nid));
      el.classList.toggle("hi", nid===id);
    });
    qsa(".g-edge", svg).forEach(el=>{
      const involved = el.getAttribute("data-from")===id || el.getAttribute("data-to")===id;
      el.classList.toggle("hi", involved);
      el.classList.toggle("dim", !involved);
    });
    const n = nodeMap[id];
    const rel = edges.filter(e=>e.from===id||e.to===id).map(e=>{
      const other = e.from===id ? e.to : e.from;
      const dir = e.from===id ? e.rel : e.rel+" (inbound)";
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span class="mono" style="font-size:11px;color:var(--text-faint)">${escapeHTML(dir)}</span><span>${escapeHTML(nodeMap[other] ? nodeMap[other].label : other)}</span></div>`;
    }).join("");
    const p = PRODUCTS.find(x=>x.id===id);
    qs("#graph-detail").innerHTML = `<div class="panel"><div class="panel-head">${escapeHTML(n.label)}${p?` <a href="#/products/${p.slug}" style="float:right;color:var(--accent-text);font-size:12px">Open object →</a>`:""}</div><div class="panel-body">${rel || '<span class="empty-state">No relationships recorded.</span>'}</div></div>`;
  }
  function clearFocus(){
    qsa(".g-node", svg).forEach(el=>el.classList.remove("dim","hi"));
    qsa(".g-edge", svg).forEach(el=>el.classList.remove("dim","hi"));
    qs("#graph-detail").innerHTML = "";
  }
  qsa(".g-node", svg).forEach(el=>{
    el.addEventListener("mouseenter", ()=>focusNode(el.getAttribute("data-id")));
    el.addEventListener("mouseleave", clearFocus);
    el.addEventListener("focus", ()=>focusNode(el.getAttribute("data-id")));
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-id");
      const p = PRODUCTS.find(x=>x.id===id);
      if(p) navigate("products/"+p.slug); else focusNode(id);
    });
    el.addEventListener("keydown", (ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); el.click(); } });
  });

  SEO.set({title:"Systems", description:"OBLIVION system relationship graph across products, research, and people.", hash:"systems"});
}

  ${audit.length ? `<div class="panel" style="margin-top:12px"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Object type</th><th>Object</th><th>Admin</th></tr></thead><tbody>
    ${audit.map(a=>`<tr><td class="mono" style="font-size:11px">${new Date(a.ts).toLocaleString()}</td><td><span class="badge b-neutral">${escapeHTML(a.action)}</span></td><td>${escapeHTML(a.objectType)}</td><td>${escapeHTML(a.objectName||"")}</td><td class="mono" style="font-size:11px">${escapeHTML(a.admin)}</td></tr>`).join("")}
  </tbody></table></div>` : `<div class="empty-state" style="margin-top:12px">No actions recorded yet in this browser.</div>`}`;
}

function renderAdminSettings(body){
  body.innerHTML = `<h2 style="font-size:18px">Settings</h2>
  <div class="section-h">SEO export</div>
  <div class="panel"><div class="panel-body">
    <p style="font-size:12.5px">Because this deployment is a single <code class="tag">index.html</code>, a physical <code class="tag">sitemap.xml</code> / <code class="tag">robots.txt</code> is not generated as a second file here. This textual representation can be copied into those files when the site is deployed with additional static assets.</p>
    <div class="field"><label>robots.txt (suggested)</label><textarea readonly>User-agent: *
Allow: /

Sitemap: ${absUrl("")}sitemap.xml</textarea></div>
    <div class="field"><label>sitemap.xml (suggested, hash routes listed as URL fragments)</label><textarea readonly id="sitemap-out"></textarea></div>
  </div></div>

  <div class="section-h" style="margin-top:22px">Future backend contract</div>
  <div class="panel"><div class="panel-body" style="font-size:12.5px">
    <p>This static build implements local demo versions of the following service interfaces. A production deployment would replace each with a real implementation behind a secure API, without changing how the UI calls them:</p>
    <ul style="padding-left:18px">
      <li><b>ContentStore</b> — currently localStorage; production: a content database + API.</li>
      <li><b>AuthService</b> — currently a client-side session flag; production: real server-side authentication (e.g. OAuth/session cookies), never client-checkable secrets.</li>
      <li><b>MediaStore</b> — currently in-browser data URLs; production: object storage (e.g. S3-compatible) behind an upload API.</li>
      <li><b>SearchService</b> — currently in-memory linear scan; production: a real search index if content volume grows.</li>
      <li><b>PublishingService</b> — currently local status flags; production: a review/publish pipeline with server-side audit logging.</li>
    </ul>
  </div></div>

  <div class="section-h" style="margin-top:22px">Data management</div>
  <div class="panel"><div class="panel-body">
    <p style="font-size:12.5px">Reset all locally-stored demo content (research, engineering, releases, media, audit log). Core product data is static and unaffected.</p>
    <button class="btn btn-danger" id="reset-store">Reset local demo data</button>
  </div></div>`;

  const routes = ["home","products","systems","research","engineering","releases","developers","about","security"].concat(PRODUCTS.map(p=>"products/"+p.slug));
  qs("#sitemap-out", body).value = routes.map(r=>absUrl(r)).join("\n");

  qs("#reset-store", body).addEventListener("click", ()=>{
    if(confirm("This clears all locally stored demo content in this browser. Continue?")){
      ContentStore.reset();
      toast("Local demo data reset.");
      renderAdminSettings(body);
    }
  });
}

/* ==========================================================================
   GLOBAL SEARCH MODAL / COMMAND PALETTE (Ctrl+K)
   ========================================================================== */
const COMMANDS = [
  {label:"Go to Command Center", route:"home"},
  {label:"Go to Products", route:"products"},
  {label:"Go to Systems", route:"systems"},
  {label:"Go to Research", route:"research"},
  {label:"Go to Engineering", route:"engineering"},
  {label:"Go to Releases", route:"releases"},
  {label:"Go to Developers", route:"developers"},
  {label:"Go to Security", route:"security"},
  {label:"Go to About", route:"about"},
  {label:"Open Admin", route:"admin"}
];
let cmdkOpen = false, cmdkSel = 0, cmdkItems = [];
function openCmdk(){
  cmdkOpen = true; cmdkSel = 0;
  const host = qs("#modal-host");
  host.innerHTML = `<div class="modal-scrim" id="cmdk-scrim"><div class="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmdk-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="cmdk-input" placeholder="Search or type a command…" autofocus>
    </div>
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot"><span>↑↓ navigate</span><span>↵ select</span><span>esc close</span></div>
  </div></div>`;
  const input = qs("#cmdk-input");
  input.focus();
  function paintList(q){
    q = (q||"").trim();
    const results = q ? SearchService.search(q).map(it=>({label:it.name, sub:it.sub, type:it.type, route:it.route}))
      : COMMANDS.map(c=>({label:c.label, type:"Command", route:c.route}));
    cmdkItems = results;
    const list = qs("#cmdk-list");
    list.innerHTML = cmdkItems.length ? cmdkItems.map((it,i)=>`<div class="cmdk-item${i===cmdkSel?" sel":""}" data-i="${i}"><span class="type">${escapeHTML(it.type)}</span><span class="nm">${escapeHTML(it.label)}${it.sub?` <span style="color:var(--text-faint)">— ${escapeHTML(it.sub)}</span>`:""}</span></div>`).join("")
      : `<div class="cmdk-empty">No matches.</div>`;
    qsa(".cmdk-item", list).forEach(el=>el.addEventListener("click", ()=>{ navigate(cmdkItems[+el.getAttribute("data-i")].route); closeCmdk(); }));
  }
  paintList("");
  input.addEventListener("input", ()=>{ cmdkSel=0; paintList(input.value); });
  input.addEventListener("keydown",(e)=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); cmdkSel = Math.min(cmdkSel+1, cmdkItems.length-1); paintList(input.value); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); cmdkSel = Math.max(cmdkSel-1, 0); paintList(input.value); }
    else if(e.key==="Enter"){ e.preventDefault(); if(cmdkItems[cmdkSel]){ navigate(cmdkItems[cmdkSel].route); closeCmdk(); } }
    else if(e.key==="Escape"){ closeCmdk(); }
  });
  qs("#cmdk-scrim").addEventListener("mousedown",(e)=>{ if(e.target.id==="cmdk-scrim") closeCmdk(); });
}
function closeCmdk(){ cmdkOpen=false; qs("#modal-host").innerHTML = ""; }

/* ==========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================== */
let gPending = false, gPendingTimer = null;
document.addEventListener("keydown", function(e){
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const typing = tag==="input" || tag==="textarea" || (e.target && e.target.isContentEditable);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); cmdkOpen ? closeCmdk() : openCmdk(); return; }
  if(e.key==="Escape" && cmdkOpen){ closeCmdk(); return; }
  if(typing) return;
  if(e.key.toLowerCase()==="g" && !gPending){ gPending = true; clearTimeout(gPendingTimer); gPendingTimer = setTimeout(()=>{ gPending=false; }, 900); return; }
  if(gPending){
    const map = {p:"products", r:"research", s:"systems", d:"developers"};
    const k = e.key.toLowerCase();
    if(map[k]){ navigate(map[k]); }
    gPending = false; clearTimeout(gPendingTimer);
  }
});

/* ==========================================================================
   APPLICATION BOOT
   ========================================================================== */
function initShell(){
  buildSidebarNav();
  qs("#menu-btn").addEventListener("click", ()=> qs("#sidebar").classList.toggle("open"));
  qs("#sidebar-scrim").addEventListener("click", ()=> qs("#sidebar").classList.remove("open"));
  qs("#search-trigger").addEventListener("click", openCmdk);
  qs("#activity-btn").addEventListener("click", ()=> navigate("admin/audit"));
  window.navigate = navigate;
}
window.addEventListener("error", function(ev){
  console.error("Uncaught error:", ev.error || ev.message);
});
window.addEventListener("DOMContentLoaded", function(){
  initShell();
  renderRoute();
});
</script>
